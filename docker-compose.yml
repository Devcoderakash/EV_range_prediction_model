services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install -q streamlit requests matplotlib pandas numpy &&
             streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
